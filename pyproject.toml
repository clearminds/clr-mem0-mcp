[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-mem0-mcp"
version = "0.1.0"
description = "MCP server for the self-hosted mem0 memory API (add, search, list, update, delete memories)"
authors = [{name = "clearminds"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
clr-mem0-mcp = "clr_mem0_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clr_mem0_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
